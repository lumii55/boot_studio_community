# Started by the Worker for every upload / profile change. Talks back to the Worker with this run's OIDC token.
name: moderation
run-name: moderation ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Pipeline job id
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: moderation-${{ inputs.job_id }}
  cancel-in-progress: false
env:
  TORCH_VERSION: "2.7.1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      # The installed packages (torch, transformers, Pillow) are kept between runs, so a check does not spend
      # ~30 s installing them every time. Same pinned versions either way; any change makes a new key.
      - name: Restore installed packages
        id: venv
        uses: actions/cache/restore@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-torch${{ env.TORCH_VERSION }}-${{ hashFiles('pipeline/requirements.txt', 'pipeline/requirements-vision.txt') }}
      - name: Install packages (only when not kept)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -r pipeline/requirements.txt
          ~/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          ~/venv/bin/pip install -r pipeline/requirements-vision.txt
      # Saved right away, so it is kept even if this run's check fails.
      - name: Keep installed packages
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/venv
          key: ${{ steps.venv.outputs.cache-primary-key }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vision-clip-3d74acf9-nsfw-96cb0d03
      - name: Run checks
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: ~/venv/bin/python -I pipeline/run_job.py

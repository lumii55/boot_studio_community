# Started by the Worker for every upload / profile change. Talks back to the Worker with this run's OIDC token.
name: moderation
run-name: moderation ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Pipeline job id
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: moderation-${{ inputs.job_id }}
  cancel-in-progress: false
env:
  TORCH_VERSION: "2.7.1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      # The installed packages (torch, transformers, Pillow) are kept between runs, so a check does not spend
      # ~30 s installing them every time. Same pinned versions either way; any change makes a new key.
      - name: Restore installed packages
        id: venv
        uses: actions/cache/restore@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-torch${{ env.TORCH_VERSION }}-${{ hashFiles('pipeline/requirements.txt', 'pipeline/requirements-vision.txt') }}
      - name: Install packages (only when not kept)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -r pipeline/requirements.txt
          ~/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          ~/venv/bin/pip install -r pipeline/requirements-vision.txt
      # Saved right away, so it is kept even if this run's check fails.
      - name: Keep installed packages
        if: steps.venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/venv
          key: ${{ steps.venv.outputs.cache-primary-key }}
      # The image models are kept already prepared (~330 MB: image half of CLIP + nudity model in float16, label
      # embeddings computed in advance). Any change to vision.py (models, labels) or the packages makes a new key.
      - name: Restore prepared models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bas-vision
          key: bas-vision-torch${{ env.TORCH_VERSION }}-${{ hashFiles('pipeline/vision.py', 'pipeline/requirements-vision.txt') }}
      # Never stops the run: if preparing fails, the check below still reports (a person reviews the images).
      - name: Prepare models (only when not kept)
        id: prepare
        if: steps.models.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ~/venv/bin/python -I pipeline/vision.py --prepare
      - name: Keep prepared models
        if: steps.models.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bas-vision
          key: ${{ steps.models.outputs.cache-primary-key }}
      - name: Run checks
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: ~/venv/bin/python -I pipeline/run_job.py
